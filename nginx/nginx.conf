# Reference only — production is generated by GitHub Actions
# Cloudflare Flexible SSL → HTTP:80 on VPS

worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50M;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # billing-mate.com → Next.js app
  server {
    listen 80;
    server_name billing-mate.com www.billing-mate.com;

    location /_next/static { proxy_pass http://app:3000; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /api/ { limit_req zone=api burst=20 nodelay; proxy_pass http://app:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 120s; }
    location / { proxy_pass http://app:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
  }

  # api.billing-mate.com → Supabase Kong
  server {
    listen 80;
    server_name api.billing-mate.com;
    location / { proxy_pass http://kong:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 120s; }
  }

  # studio.billing-mate.com → Supabase Studio
  server {
    listen 80;
    server_name studio.billing-mate.com;
    location / { proxy_pass http://studio:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
  }
}
